# Local development profile. Values come from environment variables (typically a
# git-ignored .env file consumed by Docker Compose / the shell) — never literal
# secrets (AGENTS.md §24). See .env.example.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onlinejudge}
    username: ${DB_USERNAME:onlinejudge}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:onlinejudge}
    password: ${RABBITMQ_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Dev-only: optionally create an admin account on startup (never active outside `local`).
  # With no username/password set, nothing is created (AGENTS.md §10/§24).
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
