name: CI

on:
  pull_request:
  push:

jobs:
  guards:
    name: Repository hygiene guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mechanically enforces AGENTS.md §24: no env files or credential material may
      # ever be committed. If this fails, remove the file with
      # `git rm --cached <file>` and add a .gitignore rule.
      - name: Fail if env files or credentials are tracked
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|jks|keystore)$|id_rsa.*|credentials\.(json|ya?ml)|secrets\.(json|ya?ml))' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Forbidden files are tracked in git:"
            echo "$forbidden"
            exit 1
          fi
          echo "No forbidden files tracked."

  backend:
    name: Build, Test & Static Analysis (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The docker-tests profile includes Testcontainers-backed integration tests;
      # GitHub-hosted runners have Docker, so the full suite runs here (AGENTS.md §15).
      - name: Build, test and run static analysis
        run: ./mvnw -B verify -P docker-tests

  frontend:
    name: Lint, Test & Build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
