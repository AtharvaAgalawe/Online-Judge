name: CI

on:
  pull_request:
  push:

jobs:
  backend:
    name: Build, Test & Static Analysis (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The docker-tests profile includes Testcontainers-backed integration tests;
      # GitHub-hosted runners have Docker, so the full suite runs here (AGENTS.md §15).
      - name: Build, test and run static analysis
        run: ./mvnw -B verify -P docker-tests

  frontend:
    name: Lint, Test & Build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
