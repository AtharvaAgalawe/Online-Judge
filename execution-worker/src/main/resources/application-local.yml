# Local development profile. Values come from environment variables — never literal
# secrets (AGENTS.md §24). The worker never runs Flyway; the schema is owned by the
# backend (single migrator).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onlinejudge}
    username: ${DB_USERNAME:onlinejudge}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:onlinejudge}
    password: ${RABBITMQ_PASSWORD}
