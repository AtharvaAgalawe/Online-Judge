spring:
  application:
    name: online-judge-worker
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        # Manual ack (PRD §19): ack only after the DB write commits.
        acknowledge-mode: manual
        # Bounded consumer pool; one container run per thread in later phases (PRD §19/§21).
        concurrency: 4
        prefetch: 4

server:
  port: 8081

app:
  worker:
    lease-duration: 60s
    compile-timeout: 10s
    watchdog-buffer: 2s
    max-output-bytes: 65536
    compile-memory-mb: 512
    pids-limit: 64

resilience4j:
  retry:
    instances:
      # PRD §23: bounded in-process retry for transient DB failures during the final
      # write; exhausted attempts fall through to the queue-level retry path.
      resultWrite:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.DataAccessException
